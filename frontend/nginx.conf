server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Docker's DNS, so a recreated backend container is found again.
  resolver 127.0.0.11 valid=10s;

  # Same as the Vite proxy: /api/x goes to the backend as /x. No X-Forwarded-For,
  # because the backend's rate limiter rejects it without "trust proxy".
  location /api/ {
    set $backend http://backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
  }

  # File names change with each build, so these can be kept.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Routes belong to the app, so unknown paths get index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
