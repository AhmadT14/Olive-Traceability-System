services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olive_app
      POSTGRES_PASSWORD: olive_pass
      POSTGRES_DB: olive_traceability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
 
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgres://olive_app:olive_pass@postgres:5432/olive_traceability
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "8545:8545"
 
volumes:
  postgres-data: