services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olive_app
      POSTGRES_PASSWORD: olive_pass
      POSTGRES_DB: olive_traceability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olive_app -d olive_traceability"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-shot job: creates the tables, then stores the demo participants.
  # Safe to run again; migrations that already ran are skipped and existing
  # demo rows are left alone. Re-run on its own with:
  #   docker compose run --rm migrate
  migrate:
    build: ./backend
    environment:
      - DATABASE_URL=postgres://olive_app:olive_pass@postgres:5432/olive_traceability
      - RPC_URL=http://anvil:8545
    env_file:
      - .env
    volumes:
      - deployment-data:/runtime
    command:
      - sh
      - -c
      - |
        set -eu
        set -a
        . /runtime/deployment.env
        set +a
        npm run db:migrate
        npm run db:seed
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgres://olive_app:olive_pass@postgres:5432/olive_traceability
      - PORT=3000
      - RPC_URL=http://anvil:8545
    env_file:
      - .env
    volumes:
      - deployment-data:/runtime
    command:
      - sh
      - -c
      - |
        set -a
        . /runtime/deployment.env
        set +a
        npm run dev
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 15

  forge:
    image: ghcr.io/foundry-rs/foundry:latest
    user: "0:0"
    working_dir: /workspace
    volumes:
      - ./contracts:/workspace
      - forge-build:/workspace/out
      - forge-cache:/workspace/cache
    entrypoint: ["forge"]
    command: ["build"]
    profiles:
      - tools

  deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    user: "0:0"
    working_dir: /workspace
    volumes:
      - ./contracts:/workspace
      - deployment-data:/runtime
      - forge-build:/workspace/out
      - forge-cache:/workspace/cache
      - forge-broadcast:/workspace/broadcast
    environment:
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
      PRIVATE_KEY: ${PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        output="$$(forge script script/Deploy.s.sol:Deploy --rpc-url http://anvil:8545 --broadcast --private-key "$$PRIVATE_KEY" 2>&1)"
        printf '%s\n' "$$output"
        registry="$$(printf '%s\n' "$$output" | sed -n 's/.*REGISTRY_ADDRESS= *\(0x[0-9a-fA-F]\{40\}\).*/\1/p' | tail -n 1)"
        custody="$$(printf '%s\n' "$$output" | sed -n 's/.*BATCH_CUSTODY_ADDRESS= *\(0x[0-9a-fA-F]\{40\}\).*/\1/p' | tail -n 1)"
        block="$$(cast block-number --rpc-url http://anvil:8545)"
        test -n "$$registry" && test -n "$$custody"
        {
          printf 'REGISTRY_ADDRESS=%s\n' "$$registry"
          printf 'BATCH_CUSTODY_ADDRESS=%s\n' "$$custody"
          printf 'DEPLOY_BLOCK=%s\n' "$$block"
        } > /runtime/deployment.env
    depends_on:
      anvil:
        condition: service_healthy

  seed:
    image: ghcr.io/foundry-rs/foundry:latest
    working_dir: /workspace
    volumes:
      - ./scripts:/workspace/scripts:ro
      - deployment-data:/runtime
    environment:
      RPC_URL: http://anvil:8545
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        set -a
        . /runtime/deployment.env
        set +a
        export RPC_URL
        sh /workspace/scripts/seed.sh
    depends_on:
      deploy:
        condition: service_completed_successfully

volumes:
  postgres-data:
  deployment-data:
  forge-build:
  forge-cache:
  forge-broadcast:
