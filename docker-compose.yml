x-backend: &backend
  build: ./backend
  env_file:
    - .env
  environment:
    DATABASE_URL: postgres://olive_app:olive_pass@postgres:5432/olive_traceability
    RPC_URL: http://anvil:8545
    TRUST_PROXY: "1"
  volumes:
    - deployment-data:/runtime

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olive_app
      POSTGRES_PASSWORD: olive_pass
      POSTGRES_DB: olive_traceability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olive_app -d olive_traceability"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    <<: *backend
    command:
      - sh
      - -c
      - |
        set -eu
        set -a
        . /runtime/deployment.env
        set +a
        npm run db:migrate
        npm run db:seed
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  backend:
    <<: *backend
    command:
      - sh
      - -c
      - |
        set -a
        . /runtime/deployment.env
        set +a
        npm run dev
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    user: "0:0"
    entrypoint:
      [
        "anvil",
        "--host",
        "0.0.0.0",
        "--state",
        "/data/state.json",
        "--state-interval",
        "5",
      ]
    volumes:
      - anvil-data:/data
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 15

  deploy:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    user: "0:0"
    working_dir: /repo/contracts
    volumes:
      - ./contracts:/repo/contracts
      - ./scripts:/repo/scripts:ro
      - deployment-data:/runtime
      - forge-build:/repo/contracts/out
      - forge-cache:/repo/contracts/cache
      - forge-broadcast:/repo/contracts/broadcast
    environment:
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
      PRIVATE_KEY: ${PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      RPC_URL: http://anvil:8545
      DEPLOYMENT_ENV: /runtime/deployment.env
    entrypoint: ["sh", "/repo/scripts/deploy.sh"]
    depends_on:
      anvil:
        condition: service_healthy

  seed:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    working_dir: /workspace
    volumes:
      - ./scripts:/workspace/scripts:ro
      - deployment-data:/runtime
    environment:
      RPC_URL: http://anvil:8545
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        set -a
        . /runtime/deployment.env
        set +a
        sh /workspace/scripts/seed.sh
    depends_on:
      deploy:
        condition: service_completed_successfully

volumes:
  anvil-data:
  postgres-data:
  deployment-data:
  forge-build:
  forge-cache:
  forge-broadcast:
