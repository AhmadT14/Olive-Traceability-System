services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olive_app
      POSTGRES_PASSWORD: olive_pass
      POSTGRES_DB: olive_traceability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=olive_app
      - DB_PASSWORD=olive_pass
      - DB_NAME=olive_traceability
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres-data: